<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shashi Admin | Swamy Computers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body x-data="adminPanel()" x-init="init()">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col">
            <div class="mb-10">
                <h1 class="text-xl font-bold text-orange-400">Shashi Provision</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest leading-tight">Pannapura Cross, Karatagi</p>
            </div>
            
            <nav class="space-y-3 flex-1">
                <button @click="view = 'products'" :class="view === 'products' ? 'text-orange-400 bg-orange-400/10' : 'text-slate-400 hover:bg-slate-800'" class="w-full text-left p-4 rounded-2xl transition font-bold flex items-center gap-3">
                    <span>📦</span> Products
                </button>
                <button @click="view = 'orders'" :class="view === 'orders' ? 'text-orange-400 bg-orange-400/10' : 'text-slate-400 hover:bg-slate-800'" class="w-full text-left p-4 rounded-2xl transition font-bold flex items-center gap-3">
                    <span>📑</span> Orders
                </button>
                <button @click="view = 'users'" :class="view === 'users' ? 'text-orange-400 bg-orange-400/10' : 'text-slate-400 hover:bg-slate-800'" class="w-full text-left p-4 rounded-2xl transition font-bold flex items-center gap-3">
                    <span>👥</span> Manage Users
                </button>
            </nav>

            <div class="mt-auto pt-6 border-t border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Application Developed By</p>
                <p class="text-orange-400 font-bold text-sm">Swamy Computers, Karatagi</p>
                <p class="text-slate-400 text-[11px] mt-1">Mo: +91 9902389300</p>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto bg-slate-950/50">
            
            <template x-if="view === 'products'">
                <div class="animate-in fade-in duration-500">
                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <h2 class="text-3xl font-bold">Inventory</h2>
                            <p class="text-slate-400 text-sm">Manage items and pricing</p>
                        </div>
                        <div class="flex gap-3">
                            <button @click="exportExcel()" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-700 transition">Export CSV</button>
                            <label class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-700 transition cursor-pointer">
                                Import <input type="file" @change="importExcel($event)" class="hidden" accept=".xlsx, .xls, .csv">
                            </label>
                            <button @click="openModal()" class="bg-orange-600 px-6 py-2 rounded-xl font-bold hover:bg-orange-500 transition shadow-lg shadow-orange-900/20">+ Add Item</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <template x-for="(p, index) in products" :key="index">
                            <div class="bg-slate-900 p-5 rounded-3xl flex justify-between items-center border border-slate-800 hover:border-orange-500/30 transition shadow-sm">
                                <div class="flex items-center gap-5">
                                    <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center text-4xl" x-text="p.icon"></div>
                                    <div>
                                        <h4 class="font-bold text-xl text-white" x-text="p.name"></h4>
                                        <div class="flex flex-wrap gap-2 mt-2">
                                            <template x-for="v in p.variants">
                                                <span class="text-[10px] bg-slate-800 px-3 py-1 rounded-full text-orange-400 border border-slate-700 font-bold" x-text="v.unit + ': ₹' + v.price"></span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-4">
                                    <button @click="editProduct(index)" class="bg-blue-500/10 text-blue-400 px-4 py-2 rounded-xl font-bold hover:bg-blue-500 hover:text-white transition">Edit</button>
                                    <button @click="deleteProduct(index)" class="bg-red-500/10 text-red-400 px-4 py-2 rounded-xl font-bold hover:bg-red-500 hover:text-white transition">Delete</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="view === 'users'">
                <div class="animate-in fade-in duration-500">
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <h2 class="text-3xl font-bold mb-1">Customer Management</h2>
                            <p class="text-slate-400 text-sm">Edit, Reset Password, or Remove Users</p>
                        </div>
                        <div class="w-64">
                            <input type="text" x-model="userSearch" placeholder="Search name or phone..." class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none focus:border-orange-500 transition">
                        </div>
                    </div>
                    
                    <div class="bg-slate-900 rounded-[2rem] overflow-hidden border border-slate-800 shadow-xl">
                        <table class="w-full text-left">
                            <thead class="bg-slate-800/50 text-slate-400 text-[10px] uppercase tracking-widest">
                                <tr>
                                    <th class="p-5">Name & Gender</th>
                                    <th class="p-5">Contact Details</th>
                                    <th class="p-5">Password</th>
                                    <th class="p-5">Delivery Address</th>
                                    <th class="p-5 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm">
                                <template x-for="(u, idx) in filteredUsers" :key="idx">
                                    <tr class="border-t border-slate-800 hover:bg-slate-800/30 transition">
                                        <td class="p-5">
                                            <div class="font-bold text-white text-base" x-text="u.name"></div>
                                            <div class="text-[10px] text-slate-500 font-bold uppercase" x-text="u.gender"></div>
                                        </td>
                                        <td class="p-5 font-bold text-orange-400" x-text="u.phone"></td>
                                        <td class="p-5">
                                            <span class="bg-slate-800 px-3 py-1 rounded-lg font-mono text-orange-500 text-xs border border-slate-700" x-text="u.password"></span>
                                        </td>
                                        <td class="p-5 text-slate-400 text-xs leading-tight" x-text="u.address"></td>
                                        <td class="p-5">
                                            <div class="flex gap-2 justify-center">
                                                <button @click="openUserEdit(u)" class="p-2 bg-blue-500/10 text-blue-400 rounded-lg hover:bg-blue-500 hover:text-white transition">✎</button>
                                                <button @click="deleteUser(u.phone)" class="p-2 bg-red-500/10 text-red-400 rounded-lg hover:bg-red-500 hover:text-white transition">✕</button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template x-if="filteredUsers.length === 0">
                            <div class="p-10 text-center text-slate-500 font-bold">No users found.</div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="view === 'orders'">
                <div class="animate-in fade-in duration-500">
                    <h2 class="text-3xl font-bold mb-8">Recent Orders</h2>
                    <div class="space-y-6">
                        <template x-for="order in orders">
                            <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-lg relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-2 h-full bg-orange-600"></div>
                                <div class="flex justify-between items-start mb-6">
                                    <div>
                                        <div class="text-2xl font-bold text-white" x-text="order.name"></div>
                                        <div class="text-slate-500 text-sm font-bold" x-text="order.date"></div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-slate-500 text-[10px] font-bold uppercase">Grand Total</div>
                                        <div class="text-3xl font-black text-orange-400">₹<span x-text="order.total"></span></div>
                                    </div>
                                </div>
                                <div class="grid md:grid-cols-2 gap-6">
                                    <div class="bg-slate-950/50 p-5 rounded-2xl border border-slate-800">
                                        <div class="text-[10px] text-slate-500 font-bold uppercase mb-2">Order Items</div>
                                        <div class="text-sm text-slate-300 space-y-1" x-html="order.items"></div>
                                    </div>
                                    <div class="space-y-4">
                                        <div class="flex items-center gap-3 text-slate-300">
                                            <span class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs">📞</span>
                                            <span class="font-bold" x-text="order.whatsapp"></span>
                                        </div>
                                        <div class="flex items-start gap-3 text-slate-400 text-sm">
                                            <span class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs shrink-0">📍</span>
                                            <span x-text="order.address"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <div x-show="showUserModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-[60]" x-cloak x-transition>
        <div class="bg-slate-900 border border-slate-800 p-10 rounded-[3rem] w-full max-w-lg">
            <h3 class="text-2xl font-bold mb-6 text-white">Edit Customer Profile</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Full Name</label>
                    <input x-model="userForm.name" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Password (Security Reset)</label>
                    <input x-model="userForm.password" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-orange-400 font-bold outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Delivery Address</label>
                    <textarea x-model="userForm.address" rows="3" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none focus:border-orange-500"></textarea>
                </div>
                <div class="flex gap-4 pt-4">
                    <button @click="saveUserEdit()" class="flex-1 bg-orange-600 p-4 rounded-2xl font-bold hover:bg-orange-500 transition">Update User</button>
                    <button @click="showUserModal = false" class="bg-slate-800 p-4 px-8 rounded-2xl font-bold text-slate-400">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div x-show="showModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak x-transition>
        <div class="bg-slate-900 border border-slate-800 p-10 rounded-[3rem] w-full max-w-xl shadow-2xl">
            <h3 class="text-3xl font-bold mb-8 text-white" x-text="editIndex === null ? 'Add New Product' : 'Update Item'"></h3>
            <div class="space-y-6">
                <div class="grid grid-cols-4 gap-4">
                    <div class="col-span-3">
                        <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Product Name</label>
                        <input x-model="form.name" type="text" class="w-full bg-slate-800 p-4 rounded-2xl border border-slate-700 outline-none focus:border-orange-500 transition">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1 text-center">Icon</label>
                        <input x-model="form.icon" type="text" class="w-full bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[10px] text-slate-500 font-bold uppercase">Pricing Variants</label>
                        <button @click="form.variants.push({unit:'', price:''})" class="text-orange-400 text-xs font-bold">+ Add Price Option</button>
                    </div>
                    <div class="space-y-3 max-h-40 overflow-y-auto pr-2">
                        <template x-for="(v, vi) in form.variants" :key="vi">
                            <div class="flex gap-3 items-center">
                                <input x-model="v.unit" placeholder="e.g. 500gm" class="flex-1 bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none">
                                <input x-model="v.price" type="number" placeholder="Price" class="w-24 bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none">
                                <button @click="form.variants.splice(vi,1)" class="text-red-500 p-2 font-bold">✕</button>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="flex gap-4 pt-6">
                    <button @click="saveProduct()" class="flex-1 bg-orange-600 p-5 rounded-2xl font-bold hover:bg-orange-500 transition">Save Product</button>
                    <button @click="showModal = false" class="bg-slate-800 p-5 px-10 rounded-2xl font-bold text-slate-400">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function adminPanel() {
            return {
                view: 'products', showModal: false, showUserModal: false, editIndex: null, userSearch: '',
                products: [], orders: [], users: [],
                form: { name: '', icon: '📦', variants: [{ unit: '1 KG', price: '' }] },
                userForm: { name: '', phone: '', password: '', address: '' },
                
                init() {
                    this.refreshData();
                    setInterval(() => this.refreshData(), 30000);
                },

                refreshData() {
                    this.products = JSON.parse(localStorage.getItem('freshgo_products') || '[]');
                    this.orders = JSON.parse(localStorage.getItem('freshgo_orders') || '[]').reverse();
                    this.users = JSON.parse(localStorage.getItem('registered_users') || '[]');
                },

                get filteredUsers() {
                    if (!this.userSearch) return this.users;
                    return this.users.filter(u => 
                        u.name.toLowerCase().includes(this.userSearch.toLowerCase()) || 
                        u.phone.includes(this.userSearch)
                    );
                },

                // USER ACTIONS
                openUserEdit(user) {
                    this.userForm = JSON.parse(JSON.stringify(user));
                    this.showUserModal = true;
                },

                saveUserEdit() {
                    let users = JSON.parse(localStorage.getItem('registered_users') || '[]');
                    const idx = users.findIndex(u => u.phone === this.userForm.phone);
                    if (idx !== -1) {
                        users[idx] = this.userForm;
                        localStorage.setItem('registered_users', JSON.stringify(users));
                        this.refreshData();
                        this.showUserModal = false;
                        alert('User profile updated successfully!');
                    }
                },

                deleteUser(phone) {
                    if (confirm('Are you sure you want to delete this user? They will lose access to their account.')) {
                        let users = JSON.parse(localStorage.getItem('registered_users') || '[]');
                        users = users.filter(u => u.phone !== phone);
                        localStorage.setItem('registered_users', JSON.stringify(users));
                        this.refreshData();
                    }
                },

                // PRODUCT ACTIONS
                openModal() { 
                    this.editIndex = null; 
                    this.form = { name: '', icon: '📦', variants: [{ unit: '1 KG', price: '' }] }; 
                    this.showModal = true; 
                },

                saveProduct() {
                    if(!this.form.name || this.form.variants.some(v => !v.price)) return alert('Fill name and prices');
                    if(this.editIndex !== null) this.products[this.editIndex] = JSON.parse(JSON.stringify(this.form));
                    else this.products.push(JSON.parse(JSON.stringify(this.form)));
                    
                    localStorage.setItem('freshgo_products', JSON.stringify(this.products));
                    this.showModal = false;
                },

                deleteProduct(i) { 
                    if(confirm('Permanently delete this item?')) { 
                        this.products.splice(i,1); 
                        localStorage.setItem('freshgo_products', JSON.stringify(this.products)); 
                    } 
                },

                editProduct(i) { 
                    this.editIndex = i; 
                    this.form = JSON.parse(JSON.stringify(this.products[i])); 
                    this.showModal = true; 
                },

                exportExcel() {
                    let rows = this.products.flatMap(p => p.variants.map(v => ({
                        'Product Name': p.name, 
                        'Emoji': p.icon, 
                        'Unit': v.unit, 
                        'Price': v.price
                    })));
                    const ws = XLSX.utils.json_to_sheet(rows);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Store Inventory");
                    XLSX.writeFile(wb, "Shashi_Provision_Store_Karatagi_583229.xlsx");
                },

                importExcel(e) {
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        const data = new Uint8Array(f.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        const grouped = {};
                        json.forEach(row => {
                            const name = row['Product Name'] || row.Name;
                            const icon = row['Emoji'] || row.Icon || '📦';
                            if(!grouped[name]) grouped[name] = { name: name, icon: icon, variants: [] };
                            grouped[name].variants.push({ unit: row.Unit, price: row.Price });
                        });
                        this.products = Object.values(grouped);
                        localStorage.setItem('freshgo_products', JSON.stringify(this.products));
                        alert('Inventory updated from Excel!');
                    };
                    reader.readAsArrayBuffer(e.target.files[0]);
                }
            }
        }
    </script>
</body>
</html>
